name: Build and validate parametric CAD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install pinned official OpenSCAD snapshot and BOSL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libgl1 libopengl0 libglu1-mesa libxkbcommon-x11-0 libxcb-xinerama0 libxrender1 libxext6 libfontconfig1 libfreetype6 libdbus-1-3
          mkdir -p "$RUNNER_TEMP/openscad-runtime" "$RUNNER_TEMP/openscad-libraries"
          cd "$RUNNER_TEMP/openscad-runtime"
          curl --fail --location --retry 3 --output OpenSCAD-2026.07.20-x86_64.AppImage https://files.openscad.org/snapshots/OpenSCAD-2026.07.20-x86_64.AppImage
          curl --fail --location --retry 3 --output OpenSCAD-2026.07.20-x86_64.AppImage.sha256 https://files.openscad.org/snapshots/OpenSCAD-2026.07.20-x86_64.AppImage.sha256
          sha256sum --check OpenSCAD-2026.07.20-x86_64.AppImage.sha256
          chmod +x OpenSCAD-2026.07.20-x86_64.AppImage
          ./OpenSCAD-2026.07.20-x86_64.AppImage --appimage-extract >/dev/null
          echo "OPENSCAD_BIN=$RUNNER_TEMP/openscad-runtime/squashfs-root/AppRun" >> "$GITHUB_ENV"
          git clone --quiet https://github.com/BelfrySCAD/BOSL2.git "$RUNNER_TEMP/openscad-libraries/BOSL2"
          git -C "$RUNNER_TEMP/openscad-libraries/BOSL2" checkout --quiet 1351a9f7e5f30a95228e580d167fd4f2e184ad2c
          echo "OPENSCADPATH=$RUNNER_TEMP/openscad-libraries" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/openscad-runtime/squashfs-root/AppRun" --version
      - name: Run tests
        run: python -m pytest -q tests
      - name: Generate editable STEP and printable STL models
        run: python cad/generate.py --part all
      - name: Phase 1 - generate native Full, Lite and openConnect receiver
        run: |
          python cad/opengrid/generate_interfaces.py --variant all --openscad "$OPENSCAD_BIN"
          python cad/opengrid/validate_interfaces.py
      - name: Phase 2 - generate and validate cable hook accessory
        run: |
          python cad/opengrid/generate_accessory.py --openscad "$OPENSCAD_BIN"
          python cad/opengrid/validate_accessory.py
      - name: Phase 3 - verify meshes and publish visual previews
        run: python cad/opengrid/release_pipeline.py --openscad "$OPENSCAD_BIN"
      - name: Upload downloadable CAD models
        uses: actions/upload-artifact@v4
        with:
          name: opengrid-cad-library-exports
          path: output/
          if-no-files-found: error
