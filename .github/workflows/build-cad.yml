name: Build and validate parametric CAD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Generate editable STEP and printable STL models
        run: python cad/generate.py --part all
      - name: Upload downloadable CAD models
        uses: actions/upload-artifact@v4
        with:
          name: opengrid-cad-library-v0.1-exports
          path: output/
          if-no-files-found: error
