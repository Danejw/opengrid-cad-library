name: Build and validate parametric CAD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CAD dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install OpenSCAD and pinned BOSL2 library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad
          mkdir -p "$RUNNER_TEMP/openscad-libraries"
          git clone --quiet https://github.com/BelfrySCAD/BOSL2.git "$RUNNER_TEMP/openscad-libraries/BOSL2"
          git -C "$RUNNER_TEMP/openscad-libraries/BOSL2" checkout --quiet 1351a9f7e5f30a95228e580d167fd4f2e184ad2c
          echo "OPENSCADPATH=$RUNNER_TEMP/openscad-libraries" >> "$GITHUB_ENV"
          openscad --version
      - name: Run tests
        run: python -m pytest -q tests
      - name: Generate editable STEP and printable STL models
        run: python cad/generate.py --part all
      - name: Phase 1 - generate native Full, Lite and openConnect receiver
        run: |
          python cad/opengrid/generate_interfaces.py --variant all
          python cad/opengrid/validate_interfaces.py
      - name: Upload downloadable CAD models
        uses: actions/upload-artifact@v4
        with:
          name: opengrid-cad-library-exports
          path: output/
          if-no-files-found: error
