name: Bootstrap openGrid Studio sources
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/studio-part*.b64'
      - '.github/workflows/bootstrap-studio.yml'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract reviewed source bundle
        run: |
          set -euo pipefail
          cat .bootstrap/studio-part*.b64 | base64 --decode > "$RUNNER_TEMP/studio.tar.xz"
          echo "19fd0de222e7cf97e229403a7180ae9b710bd69ccbc9ad99b836317f1518b0ca  $RUNNER_TEMP/studio.tar.xz" | sha256sum --check
          tar -tJf "$RUNNER_TEMP/studio.tar.xz" > "$RUNNER_TEMP/source-files.txt"
          grep -q '^web/src/App.tsx
          tar -xJf "$RUNNER_TEMP/studio.tar.xz"
          test -f web/src/styles.css
          test -f scripts/build_site_assets.py
      - name: Commit editable project files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web scripts docs/STUDIO_ARCHITECTURE.md tests/test_site_assets.py
          git rm -r --quiet .bootstrap
          git commit -m "Studio: add editable React app, 3D viewer and CAD web asset builder"
          git push origin HEAD:main
